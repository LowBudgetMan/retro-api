spring:
  application:
    name: retro-api
  data:
    jpa:
      repositories:
        enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  liquibase:
    change-log: db/changelog.xml
  threads:
    virtual:
      enabled: true
web:
  cors:
    allowed-origins:
management:
  endpoints:
    web:
      exposure:
        include: health
  otlp:
    metrics:
      export:
        enabled: false
        url: http://localhost:4318/v1/metrics
        step: 60s
        resource-attributes:
          service.name: retro-api