spring:
  application:
    name: retro-api
  data:
    jpa:
      repositories:
        enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  liquibase:
    change-log: db/changelog.xml
  threads:
    virtual:
      enabled: true
web:
  cors:
    allowed-origins:
management:
  endpoints:
    web:
      exposure:
        include: health
  opentelemetry:
    resource-attributes:
      service.name: retro-api
      deployment.environment: ${DEPLOYMENT_ENVIRONMENT:unknown}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    metrics:
      export:
        enabled: false
        step: 60s
retro:
  teams:
    default-plan: FREE